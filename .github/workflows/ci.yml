name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # staticcheck 2026.2.1 needs Go 1.26+ and can't read Go 1.27.2's export
      # data; bump both together.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [FuzzScanner, FuzzParse, FuzzFormatIdempotent, FuzzModifyApply]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30s ./...
