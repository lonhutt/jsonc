name: CI

on:
  push:
    branches: [main]
  pull_request:

# read-only unless a job says otherwise; only release writes
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # staticcheck 2026.2.1 needs Go 1.26+ and can't read Go 1.27.2's export
      # data; bump both together.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [FuzzScanner, FuzzParse, FuzzFormatIdempotent, FuzzModifyApply]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30s ./...

  # Every push to main that passes is a release: the newest vX.Y.Z tag with the
  # patch bumped, or v0.0.1 for the first. For a minor or major bump, push that
  # tag by hand; the next release counts up from it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, staticcheck, fuzz]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # two quick pushes mustn't both take the same version
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pick the next version
        id: version
        run: |
          # Release jobs start in whichever order their checks finish, not push
          # order; an older commit mustn't take a newer version. The run for
          # the tip releases everything.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved past $GITHUB_SHA; the newer run will release"
            exit 0
          fi
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "HEAD is already tagged; nothing to release"
            exit 0
          fi
          # plain vX.Y.Z only; a pre-release tag like v1.0.0-rc1 doesn't count
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$last" ]; then
            next=v0.0.1
          else
            IFS=. read -r major minor patch <<<"${last#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - name: Tag and release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.next }}" --target "$GITHUB_SHA" --generate-notes
